name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RockPprScc/RockPprScc.csproj

      - name: Build
        run: dotnet build RockPprScc/RockPprScc.csproj -c Release --no-restore

      - name: Publish Windows build
        run: |
          dotnet publish RockPprScc/RockPprScc.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false `
            -o artifacts/publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockPprScc-win-x64
          path: artifacts/publish
          if-no-files-found: error